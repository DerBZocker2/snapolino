# Alternative zu apache-snapolino.de.conf: durchgehendes HTTPS bis zum
# Pi statt Cloudflare "Flexible". Braucht ein Cloudflare-Origin-
# Zertifikat auf dem Pi, dafuer ist auch die Strecke Cloudflare -> Pi
# verschluesselt (relevant, weil das Panel echte Passwoerter per POST
# ueber den Draht schickt).
#
# In Cloudflare einstellen: SSL/TLS -> Overview -> Modus "Full (strict)".
# Zertifikat erzeugen: SSL/TLS -> Origin Server -> Create Certificate,
# Hostnamen snapolino.de + *.snapolino.de. Auf dem Pi ablegen:
#   sudo mkdir -p /etc/ssl/cloudflare
#   sudo nano /etc/ssl/cloudflare/snapolino.de.pem   # Origin Certificate
#   sudo nano /etc/ssl/cloudflare/snapolino.de.key   # Private Key
#   sudo chmod 600 /etc/ssl/cloudflare/snapolino.de.key
#
# Port 8080/8443 statt 80/443: Auf diesem Pi belegt Pi-hole (pihole-FTL)
# die Ports 80/443 fuer seine eigene Oberflaeche, Apache haengt deshalb
# an 8080 (siehe apache-snapolino.de.conf). Fuer diese Variante braucht
# es zusaetzlich einen neuen Port 8443 fuer TLS UND eine neue
# Portweiterleitung im Router (extern 443 -> Pi-Port 8443) - die
# bestehende Weiterleitung deckt vermutlich nur 80->8080 ab.
#
# Voraussetzungen:
#   sudo a2enmod ssl headers
#   echo "Listen 8443" | sudo tee -a /etc/apache2/ports.conf
#   sudo a2ensite snapolino.de
#   sudo systemctl reload apache2

<VirtualHost *:8080>
    ServerName snapolino.de
    ServerAlias www.snapolino.de
    RedirectMatch ^/(?!\.well-known/) https://snapolino.de$0
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:8443>
    ServerName snapolino.de
    ServerAlias www.snapolino.de

    DocumentRoot /var/www/snapolino.de/backend/public

    <Directory /var/www/snapolino.de/backend/public>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile      /etc/ssl/cloudflare/snapolino.de.pem
    SSLCertificateKeyFile   /etc/ssl/cloudflare/snapolino.de.key

    php_admin_value upload_max_filesize 20M
    php_admin_value post_max_size 20M

    ErrorLog  ${APACHE_LOG_DIR}/snapolino.de-error.log
    CustomLog ${APACHE_LOG_DIR}/snapolino.de-access.log combined
</VirtualHost>
</IfModule>
