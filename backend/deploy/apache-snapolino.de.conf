# Apache vhost fuer snapolino.de auf dem Raspberry Pi.
# Nach /etc/apache2/sites-available/snapolino.de.conf kopieren.
#
# Port 8080 statt 80: Auf diesem Pi belegt Pi-hole (pihole-FTL) die
# Ports 80/443 fuer seine eigene Oberflaeche, Apache haengt fuer alle
# anderen Seiten (z.B. derbzocker2.de) deshalb an Port 8080. Vor dem
# Einspielen pruefen, ob das noch stimmt:
#   cat /etc/apache2/ports.conf
#   cat /etc/apache2/sites-available/derbzocker2.de.conf
# Der Router leitet extern 80/443 bereits auf Pi-Port 8080 weiter (sonst
# waeren die bestehenden Seiten nicht erreichbar) - dafuer ist an
# Router/Cloudflare nichts Zusaetzliches noetig, Apache unterscheidet
# die Domains ueber den Hostnamen.
#
# Diese Variante nutzt Cloudflare im Modus "Flexible": Cloudflare
# spricht TLS mit dem Besucher, aber nur einfaches HTTP mit diesem
# Apache. Auf dem Pi wird deshalb KEIN Zertifikat benoetigt. Nachteil:
# die Strecke Cloudflare -> Pi (ueber die oeffentliche IP) ist
# unverschluesseltes HTTP, auch Login-Formulardaten des Panels laufen
# darueber im Klartext. Wer das nicht will, siehe
# apache-snapolino.de-full-strict.conf fuer die Variante mit
# Cloudflare-Origin-Zertifikat und durchgehendem HTTPS.
#
# In Cloudflare zusaetzlich einstellen:
#   SSL/TLS -> Overview -> Modus "Flexible"
#   SSL/TLS -> Edge Certificates -> "Always Use HTTPS" an
#     (damit Cloudflare Besucher automatisch auf https umleitet -
#     eine Umleitung hier im vhost wuerde bei "Flexible" eine
#     Redirect-Schleife erzeugen)
#
# Voraussetzungen:
#   sudo a2enmod headers
#   sudo a2ensite snapolino.de
#   sudo systemctl reload apache2
#
# Pfade unten an die eigene Installation anpassen, falls abweichend.

<VirtualHost *:8080>
    ServerName snapolino.de
    ServerAlias www.snapolino.de

    # Docroot ist backend/public, NICHT backend/ selbst - sonst waeren
    # includes/, sql/, storage/ und bin/ direkt aus dem Web erreichbar.
    DocumentRoot /var/www/snapolino.de/backend/public

    <Directory /var/www/snapolino.de/backend/public>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # Rahmen-Upload im Panel kann bis zu 15 MB gross sein, PHP-Standard
    # (meist 2 MB) reicht dafuer nicht. Nur wirksam mit mod_php - bei
    # PHP-FPM stattdessen im jeweiligen Pool (z.B. www.conf) setzen.
    php_admin_value upload_max_filesize 20M
    php_admin_value post_max_size 20M

    ErrorLog  ${APACHE_LOG_DIR}/snapolino.de-error.log
    CustomLog ${APACHE_LOG_DIR}/snapolino.de-access.log combined
</VirtualHost>
