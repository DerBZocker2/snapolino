# Apache vhost fuer snapolino.de auf dem Raspberry Pi.
# Nach /etc/apache2/sites-available/snapolino.de.conf kopieren.
#
# Voraussetzungen:
#   sudo a2enmod ssl headers
#   sudo a2ensite snapolino.de
#   sudo systemctl reload apache2
#
# Pfade unten an die eigene Installation anpassen, falls abweichend.

<VirtualHost *:80>
    ServerName snapolino.de
    ServerAlias www.snapolino.de

    # Nur fuer die Let's-Encrypt-HTTP-Challenge noetig, falls doch mal
    # genutzt. Ansonsten alles auf https umleiten.
    RedirectMatch ^/(?!\.well-known/) https://snapolino.de$0
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName snapolino.de
    ServerAlias www.snapolino.de

    # Docroot ist backend/public, NICHT backend/ selbst - sonst waeren
    # includes/, sql/, storage/ und bin/ direkt aus dem Web erreichbar.
    DocumentRoot /var/www/snapolino.de/backend/public

    <Directory /var/www/snapolino.de/backend/public>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # Cloudflare-Origin-Zertifikat: im Cloudflare-Dashboard unter
    # SSL/TLS -> Origin Server -> "Create Certificate" erzeugen und hier
    # ablegen. SSL/TLS-Modus in Cloudflare auf "Full (strict)" stellen.
    SSLEngine on
    SSLCertificateFile      /etc/ssl/cloudflare/snapolino.de.pem
    SSLCertificateKeyFile   /etc/ssl/cloudflare/snapolino.de.key

    # Rahmen-Upload im Panel kann bis zu 15 MB gross sein, PHP-Standard
    # (meist 2 MB) reicht dafuer nicht. Nur wirksam mit mod_php - bei
    # PHP-FPM stattdessen im jeweiligen Pool (z.B. www.conf) setzen.
    php_admin_value upload_max_filesize 20M
    php_admin_value post_max_size 20M

    ErrorLog  ${APACHE_LOG_DIR}/snapolino.de-error.log
    CustomLog ${APACHE_LOG_DIR}/snapolino.de-access.log combined
</VirtualHost>
</IfModule>
